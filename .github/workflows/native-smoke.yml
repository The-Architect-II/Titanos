name: Native model qualification
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'JSON runner label; ubuntu-latest for CPU or a configured self-hosted GPU runner'
        default: '"ubuntu-latest"'
        required: true
      gpus:
        description: 'Two GPU indices, or empty for CPU replicas and TP'
        default: ''
jobs:
  smoke:
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        if: inputs.gpus == ''
        run: python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install engine
        run: python -m pip install '.[models]'
      - name: Check device identity boundaries
        run: python tests/check_devices.py
      - name: Check GPU runner prerequisites
        if: inputs.gpus != ''
        run: python -c "import torch; assert torch.cuda.is_available(), 'Install a matching PyTorch GPU runtime before qualification'"
      - name: Fetch pinned chat checkpoints
        run: |
          titanos --config fixtures.json pull chat HuggingFaceTB/SmolLM2-135M-Instruct --revision 12fd25f77366fa6b3b4b768ec3050bf629380bac --task chat --anonymous
          titanos --config fixtures.json pull tp hf-internal-testing/tiny-random-LlamaForCausalLM --revision 9fb191250dd56d0ba7ec9785a025ed29c03d5998 --task chat --anonymous
      - name: Qualify requested modes
        env:
          GPU_LIST: ${{ inputs.gpus }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          models = json.load(open('fixtures.json'))['models']
          gpus = os.environ['GPU_LIST'].split()
          base = [sys.executable, 'tests/check_parallel.py', '--model', models['chat']['path'], '--tp-model', models['tp']['path']]
          if gpus:
              subprocess.run(base + ['--gpus', *gpus, '--require-all', '--report', 'gpu.json'], check=True)
          else:
              subprocess.run(base + ['--mode', 'replicas', '--require-all', '--report', 'replicas.json'], check=True)
              subprocess.run(base + ['--mode', 'tensor_parallel', '--require-all', '--report', 'tp.json'], check=True)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-qualification
          path: |
            gpu.json
            replicas.json
            tp.json
