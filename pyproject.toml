[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "titanos-engine"
version = "0.5.31"
description = "Standalone, local-first multimodal inference engine"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
keywords = ["inference", "local-first", "multimodal", "llm", "mcp", "openai-compatible", "llama.cpp", "onnx", "openvino", "directml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "filelock>=3.18,<4", "mcp==2.2.0",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1", "huggingface-hub>=0.34,<1",
  # uvicorn accepts inbound WebSocket upgrades only with websockets (or wsproto) installed: the native passthrough's
  # Realtime / Live / stream-input relays need it (the outbound half is Titanos' own RFC 6455 client)
  "websockets>=13,<17",
]

[project.urls]
Homepage = "https://github.com/pgoode41/Titanos"
Source = "https://github.com/pgoode41/Titanos"
Issues = "https://github.com/pgoode41/Titanos/issues"
Security = "https://github.com/pgoode41/Titanos/security/policy"

[project.optional-dependencies]
mcp = ["mcp==2.2.0"]
build = ["pyinstaller==6.22.2", "build>=1.2,<2", "wheel", "psutil>=6,<8"]
compiled = ["numpy>=1.26,<2.6", "transformers>=4.57,<4.58", "sentencepiece>=0.2,<1"]
onnx = ["onnxruntime==1.27.0", "numpy>=1.26,<2.6", "transformers>=4.57,<4.58"]
vad = ["onnxruntime==1.27.0", "numpy>=1.26,<2.6", "imageio-ffmpeg>=0.6,<1"]
dml-vision = ["onnxruntime-directml==1.24.4; sys_platform == 'win32' and platform_machine == 'AMD64'", "diffusers==0.35.2", "torch>=2.8,<2.9", "transformers>=4.57,<4.58", "numpy>=1.26,<2.6", "Pillow>=12,<13", "scipy>=1.15,<2"]
dml = ["onnxruntime-directml==1.24.4; sys_platform == 'win32' and platform_machine == 'AMD64'", "numpy>=1.26,<2.6", "transformers>=4.57,<4.58"]
dml-arm64 = ["onnxruntime-windowsml==1.25.2.202605110140; sys_platform == 'win32' and platform_machine == 'ARM64'", "numpy>=1.26,<2.6", "transformers>=4.57,<4.58"]
openvino = ["openvino==2026.3.1", "numpy>=1.26,<2.6", "transformers>=4.57,<4.58"]
genai = ["openvino-genai==2026.3.1.0", "numpy>=1.26,<2.6"]
genai-vision = ["openvino-genai==2026.3.1.0", "numpy>=1.26,<2.6", "pillow>=11,<13"]
sentiment = ["torch>=2.8,<2.13", "transformers>=4.57,<4.58", "numpy>=1.26,<2.6", "safetensors>=0.6,<1", "sentencepiece>=0.2,<1"]
vision = ["torch>=2.8,<2.13", "transformers>=4.57,<4.58", "numpy>=1.26,<2.6", "safetensors>=0.6,<1", "sentencepiece>=0.2,<1", "pillow>=11,<13", "timm==1.0.29"]
export = ["onnx>=1.19,<2"]
models = [
  "torch>=2.8,<2.13", "torchvision>=0.23,<0.28", "transformers>=4.57,<4.58", "accelerate>=1,<2",
  "diffusers>=0.35.2,<0.36", "pillow>=11,<13",
  "scipy>=1.12,<2", "imageio>=2.36,<3", "imageio-ffmpeg>=0.6,<1",
  "sentencepiece>=0.2,<1", "ftfy==6.3.1", "timm==1.0.29",
]
xtts = ["coqui-tts>=0.27,<0.28", "torchaudio>=2.8,<2.9"]
qwen3-tts = [
  "qwen-tts @ git+https://github.com/dffdeeq/Qwen3-TTS-streaming.git@13ef823ffe76aec4ac7e35d3fec28ecfc8d7427a",
  "torchaudio>=2.8,<2.9", "librosa>=0.10.2,<0.12", "soundfile>=0.14,<0.15",
]
sherpa-onnx = ["sherpa-onnx==1.13.8", "sherpa-onnx-core==2.0.1", "numpy>=1.26,<2.6"]
# base and extras check tiers (tests/README.md): setuptools for the public-export gates, numpy and pillow for the
# fixture-driven scripts, PyYAML for the workflow-gates cross-check. Not a runtime dependency.
dev = ["setuptools>=78", "numpy>=1.26,<2.6", "pillow>=11,<13", "PyYAML>=6,<7"]

[project.scripts]
titanos = "titanos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# web/fonts: Studio's vendored Chakra Petch faces and their OFL (tools/licenses/vendored_assets.json); style.css inlines them
titanos = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg", "web/fonts/*.woff2", "web/fonts/OFL.txt", "data/*.json"]
