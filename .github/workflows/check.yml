      - run: python -B tests/check_broker_mocks.py
      - run: python -B tests/check_broker_fixtures.py
      - run: python -B tests/check_broker_fixture_lint.py
      - run: python -B tests/check_broker_vault.py
      - run: python -B tests/check_broker_egress.py
      - run: python -B tests/check_broker_source_scan.py
      - run: python -B tests/check_broker_adapters.py
      - run: python -B tests/check_broker_translation_golden.py
      - run: python -B tests/check_broker_streaming.py
      - run: python -B tests/check_broker_upstream_errors.py
      - run: python -B tests/check_broker_routing.py
