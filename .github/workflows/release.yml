name: Build draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        required: true
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=78' wheel build
      - run: python -m pip install .
      - run: python tests/check.py
      - run: python tests/check_hub.py
      - run: python tests/check_jobs.py
      - run: python -B tests/check_source_package.py
      - run: python -B tests/check_public_export_hygiene.py
      - run: python tools/build_release.py
      - run: python -m build --sdist
      - name: Create draft with build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Titanos $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md release/* dist/*
