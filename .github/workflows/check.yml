      - run: python -B tests/check_ops_readiness.py
      - run: python -B tests/check_ops_gateway_bearer.py
      - run: python -B tests/check_ops_service.py
      - run: python -B tests/check_ops_default_key.py
      - run: python -B tests/check_ollama_compat.py
      - run: python -B tests/check_performance_defaults.py
      - run: python -B tests/check_tracked_files.py
      - run: python -B tests/check_build_refusals.py
      - run: python -B tests/check_gguf_header.py
      - run: python -B tests/check_native_context.py
      - run: python -B tests/check_gpu_exclusion.py
      - run: python -B tests/check_admission.py
      - run: python -B tests/check_child_env.py
      - run: python -B tests/check_health_listener.py
      - run: python -B tests/check_log_rotation.py
      - run: python -B tests/check_owned_command_race.py
  extras:
    # extras tier: numpy and pillow (the `dev` extra) and the node:vm Studio checks on Node 22, then the OpenAI SDK
    # client checks and the broker SDK lanes (OpenAI, Anthropic, Google GenAI and ElevenLabs SDKs against a real
    # titanos serve and loopback mocks) from tests/requirements-sdk.txt. Same five legs as the contract job.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
