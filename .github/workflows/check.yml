      - run: python tests/check_replica_settings_propagation.py
      - run: node tests/check_retrieval_ui.js
      - run: python tests/check_audio.py
      - run: python tests/check_whisper_prompt.py
      - run: python tests/check_asr_gating.py
      - run: python tests/check_translation_provenance.py
      - run: python tests/check_extra_backend_generation.py
      - run: python tests/check_cpu_vision_controls.py
      - run: python tests/check_tesseract.py
      - run: python tests/check_detection_nms.py
      - run: node tests/check_asr_gating_ui.js
      - run: node tests/check_studio_pairs_ui.js
      - run: node tests/check_studio_backends_ui.js
      - run: node tests/check_studio_extensions_ui.js
      - run: node tests/check_studio_lifecycle_ui.js
      - run: node tests/check_studio_creations_persist_ui.js
      - run: node tests/check_studio_active_acquisition_ui.js
      - run: node tests/check_acquisition_progress_ui.js
      - run: node tests/check_studio_design_ui.js
      - run: node tests/check_studio_modes_i18n.js
      - run: node tests/check_assignment_ui.js
      - run: python tests/check_rerank_cancellation.py
      - run: python tests/check_sentiment_facets.py
      - run: python tests/check_sentiment_native.py
      - run: node tests/check_broker_ui.js
      - run: python -B tests/check_job_contract.py
      - run: python -m pip install -r tests/requirements-sdk.txt
      - run: python tests/check_responses_sdk.py
      - run: python tests/check_retrieval_sdk.py
      - run: python tests/check_audio_sdk.py
      - run: python tests/check_broker_sdk.py
      - run: python tests/check_broker_sdk_vendors.py
      - run: python tests/check_broker_elevenlabs_sdk.py
      - run: python tests/check_ollama_sdk.py
  windows:
    # Windows Job objects and the native supervisor need a Windows host; the archived GEN-01 controller suite runs
    # only where its tree is present (the public source copies omit tools/validation/gen01).
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python tests/check_windows_job_cleanup.py
      - run: python tests/check_windows_job_caller.py
      - run: python -B tests/check_native_tree_cleanup.py
      - if: hashFiles('tools/validation/gen01/tests/*.py') != ''
        name: Inactive GEN-01 control contracts with fake inputs
        run: python -I -S -B -c "import sys,unittest;sys.path.insert(0,'tools/validation/gen01');r=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('tools/validation/gen01/tests'));raise SystemExit(not r.wasSuccessful())"
  studio-browser:
    # Playwright 1.62.1 with Chromium against the Studio pages; evidence screenshots are uploaded as an artifact.
    # The broker lane starts real titanos serve processes, so this job also installs the project.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/check_studio_workflow_i18n.js
        env:
          TITANOS_I18N_EVIDENCE_DIR: browser-evidence
      - run: node tests/check_studio_workflow_i18n.js --simple-only
        env:
          TITANOS_I18N_EVIDENCE_DIR: browser-evidence/simple-ux
      - run: node tests/check_studio_accelerators.js
        env:
          TITANOS_ACCELERATOR_UI_EVIDENCE: browser-evidence/accelerators
      - run: node tests/check_model_setup_ui.js
      - run: node tests/check_studio_broker_browser.js
        env:
          TITANOS_BROKER_BROWSER_EVIDENCE: browser-evidence/broker
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: studio-browser-evidence
          path: browser-evidence/
  package:
    # packaging contracts with the `build` extra, then the release directory tools/build_release.py writes, as an artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'setuptools>=78' wheel '.[build]'
      - run: python -B tests/check_compose_binary.py
      - run: python -B tests/check_packaged_distributions.py
      - run: python -B tests/check_ffmpeg_bundle.py
      - run: python -B tests/check_engine_excludes.py
      - run: python -B tests/check_notice_supplements.py
      - run: python -B tests/check_broker_build_inclusion.py
      - run: python tools/build_release.py
      - uses: actions/upload-artifact@v7
        with:
          name: titanos-release
          path: release/
