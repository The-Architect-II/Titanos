      - run: python tests/check_image_output_cleanup.py
      - run: python tests/check_image_mask_interfaces.py
      - run: python tests/check_image_edit_count.py
      - run: python tests/check_instruction_edit.py
      - run: node tests/check_image_mask_ui.js
      - run: python tests/check_depth.py
      - run: python tests/check_segmentation.py
      - run: python tests/check_segmentation_interfaces.py
