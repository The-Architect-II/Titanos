name: Titanos checks
# Contract and regression checks over mocked or tiny fixtures. A green run proves the contracts the scripts name, not
# model, hardware or release qualification. tests/README.md describes the tiers; tests/checks.json mirrors the jobs
# below and `python -B tools/run_checks.py --sync-check` fails when the two drift, so a local run and CI execute the
# same list. Every `run:` stays a one-line command: tests/check_release_workflow_gates.py reads them positionally.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    # base tier: the engine's own dependencies plus setuptools (imported by the two public-export gates) and PyYAML
    # (lets check_release_workflow_gates.py cross-check its positional reader against a real parser). No numpy,
    # pillow or Node. Python 3.11-3.13 on Linux; 3.12 on Windows and macOS.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'setuptools>=78' 'PyYAML>=6,<7'
      - run: python -m pip install .
      - run: python -B tools/run_checks.py --sync-check
      - run: python tests/check.py
      - run: python tests/check_engine_quality_boundary.py
      - run: python tests/check_client_wait_deadline.py
      - run: python tests/check_acquisition_progress_units.py
      - run: python tests/check_hardware_legacy_selection.py
      - run: python tests/check_require_loaded_engine.py
      - run: python tests/check_require_loaded_native.py
      - run: python tests/check_require_loaded_http.py
      - run: python tests/check_hub.py
      - run: python tests/check_hub_local_dir.py
      - run: python tests/check_model_providers.py
      - run: python tests/check_model_inspection.py
      - run: python tests/check_setup_reconcile_loaded.py
      - run: python tests/check_model_page.py
      - run: python tests/check_acquisition.py
      - run: python tests/check_acquisition_interfaces.py
      - run: python tests/check_acquisition_atomicity.py
      - run: python tests/check_one_stop_interfaces.py
      - run: python tests/check_runtime_interfaces.py
      - run: python tests/check_accelerator_profiles.py
      - run: python tests/check_native_acquisition_join.py
      - run: python tests/check_build_resource_bindings.py
      - run: python -B tests/check_source_package.py
      - run: python -B tests/check_public_export_hygiene.py
      - run: python -B tests/check_route_contract_matrix.py
      - run: python -B tests/check_release_workflow_gates.py
      - run: python tests/check_assignments.py
      - run: python tests/check_assignment_collision.py
      - run: python tests/check_assignment_interfaces.py
      - run: python tests/check_accelerator_discovery.py
      - run: python tests/check_accelerator_assignment.py
      - run: python tests/check_music_provider.py
      - run: python tests/check_music_process.py
      - run: python tests/check_music_device.py
      - run: python tests/check_music_defaults.py
      - run: python tests/check_music_package.py
      - run: python tests/check_music_build_inclusion.py
      - run: python tests/check_remote_pool.py
      - run: python tests/check_jobs.py
